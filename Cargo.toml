[workspace]
members = [
    "crates/dux-core",
    "crates/dux-tui",
    "crates/dux",
    "crates/dux-web",
    "crates/dux-journeys",
]
resolver = "3"

# Single source of truth for the crate version so the TUI (dux-tui) and the web
# (dux-core's display_version) can never show different versions.
[workspace.package]
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.98"
chrono = { version = "0.4.41", features = ["serde"] }
rustix = { version = "1.1", features = ["termios", "process", "event", "stdio", "fs", "time"] }
dux-core = { path = "crates/dux-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
indexmap = { version = "2.13.0", features = ["serde"] }
uuid = { version = "1.17.0", features = ["v4"] }
home = "0.5.11"
content_inspector = "0.2.4"
tempfile = "3.20.0"
notify = "7"
flate2 = "1"
sysinfo = "0.35"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
libc = "0.2"
socket2 = "0.6"
url = "2.5"
percent-encoding = "2.3"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
# The websocket CLIENT the integration tests connect with. Held at the version
# axum itself depends on, so a test speaks to the server through the same
# protocol implementation the server is running rather than a second, older one.
# Bump it whenever axum's does: `cargo tree -p tokio-tungstenite` names both.
tokio-tungstenite = "0.29"

# BeautifulRust lints, shared by every member crate through `[lints] workspace = true`.
# Lints marked [lib] fit libraries; they are kept on here deliberately.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"          # each unsafe op needs its own unsafe block
missing_debug_implementations = "warn"   # every public type implements Debug
missing_docs = "warn"                    # [lib] document every public item
unreachable_pub = "warn"                 # pub items that aren't actually exported
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Groups first, at lower priority so the individual settings below win.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Panics: return errors, and give every intentional panic a reason.
unwrap_used = "warn"                     # use ?, or expect("why this cannot fail")
expect_used = "allow"                    # expect with a reason is the sanctioned form
panic_in_result_fn = "warn"              # a fn returning Result shouldn't also panic
missing_panics_doc = "warn"              # [lib] document reachable panics under # Panics
missing_errors_doc = "warn"              # [lib] document failures under # Errors

# Suppressions must explain themselves and expire when no longer needed.
allow_attributes = "warn"                # prefer #[expect] over #[allow]
allow_attributes_without_reason = "warn" # every suppression says why

# Unsafe must be justified.
undocumented_unsafe_blocks = "warn"      # // SAFETY: comment on every unsafe block
multiple_unsafe_ops_per_block = "warn"   # one unsafe operation per block

# API shape.
fn_params_excessive_bools = "warn"       # bool parameters: use an enum or two methods
struct_excessive_bools = "warn"          # many bool fields: use an enum or bitflags
clone_on_ref_ptr = "warn"                # write Rc::clone(&x) so cheap clones are visible

# Output and debugging leftovers.
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"                    # [lib] libraries log, they don't print
print_stderr = "warn"                    # [lib]

# Casts that silently lose information.
as_conversions = "warn"                  # prefer From / TryFrom
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

# Pedantic lints that are mostly noise in practice.
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = "z"    # Optimize for size.
lto = true         # Enable link time optimization.
codegen-units = 1  # Reduce parallel code generation units.
debug = 0          # No debug information
# Strip symbols here, in Cargo, so every release build is small by the same
# mechanism (CI has no separate strip step). The symbol-keeping path for
# profilers is [profile.profiling] below.
strip = "symbols"

[profile.profiling]
inherits = "release"
opt-level = 2     # Full speed optimizations (not size-optimized).
debug = 2         # Full debug info for symbols in flamegraphs.
strip = false     # Keep symbols intact for profilers.
lto = false       # Disable LTO so builds are faster during profiling.

# The binary the container journeys (crates/dux-journeys) mount into Docker:
# `cargo build --profile journeys --bin dux` writes target/journeys/dux. Release's
# own settings (opt-level "z", LTO, one codegen unit) make a build take minutes,
# and a debug build runs password hashing and PTY streaming slowly enough to
# shift the timings a journey measures, so this sits between: optimized, but
# incremental and parallel.
[profile.journeys]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
incremental = true
