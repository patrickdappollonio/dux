# Isolated dux preview stack. Brought up by ./up.sh, which builds the dux binary
# on the host and exports DUX_BIN before invoking compose.
#
# Isolation: the long-running preview shares only the read-only binary. Its
# config, sessions, and repos live in Docker volumes. The opt-in capture profile
# additionally mounts one journey read-only and its output directory. Neither
# service can reach the host's ~/.config/dux. Every published port is loopback.
services:
  dux:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-archlinux:latest}
    image: dux-preview
    container_name: dux-preview
    ports:
      - "127.0.0.1:${DUX_PORT:-8790}:8790"
      # The concurrent-TUI journey's port. That journey runs the TUI in this
      # container with `[server] serve_while_tui` on and its background server
      # bound here, so the host harness can reach a TUI-hosted serve without
      # touching the `dux server` one above (the two modes bind the same
      # addresses, so they cannot share a port). Published now because a port
      # mapping needs a container restart and a journey script cannot add one;
      # nothing listens on it until a journey configures that port. Loopback
      # only, exactly like its sibling.
      - "127.0.0.1:${DUX_TUI_PORT:-8998}:8998"
    environment:
      - DUX_PORT=8790
    volumes:
      # Host-built binary, read-only. Rebuild on the host + `docker compose
      # restart dux` to pick up new code (a new inode needs a container restart).
      - ${DUX_BIN:?set DUX_BIN to the built dux binary (up.sh does this)}:/usr/local/bin/dux:ro
      - dux-data:/data
      - dux-repos:/repos
    # A PTY-heavy app; the defaults are enough (Docker provides /dev/ptmx), but
    # give it a tty/stdin so any diagnostic that expects one behaves.
    tty: true
    stdin_open: true

  tui-shot:
    profiles: ["capture"]
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-archlinux:latest}
    image: dux-preview
    entrypoint: ["node", "/usr/local/bin/tui-driver.js"]
    working_dir: /
    environment:
      - DUX_HOME=/capture/dux
      - TERM=xterm-256color
      - COLORTERM=truecolor
      - LANG=C.UTF-8
      - TZ=UTC
    volumes:
      - ${DUX_BIN:?set DUX_BIN to the built dux binary (tui-shot.sh does this)}:/usr/local/bin/dux:ro
      - ${DUX_TUI_OUTPUT_DIR:?set DUX_TUI_OUTPUT_DIR (tui-shot.sh does this)}:/output
      - ${DUX_TUI_JOURNEY:?set DUX_TUI_JOURNEY (tui-shot.sh does this)}:/journey.js:ro
    tmpfs:
      - /capture

volumes:
  dux-data:
  dux-repos:
