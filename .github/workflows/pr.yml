name: PR

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The web UI is compiled into the dux binary, and DUX_DISABLE_UI_BUILD makes
  # crates/dux-web/build.rs skip that build entirely. A skipped build also makes
  # the static-serving tests SKIP rather than assert, so with the hatch set every
  # check here could go green on a binary with no web UI. Refuse it outright:
  # anything that builds or tests must run with the frontend build ON.
  no-ui-build-hatch:
    name: Reject DUX_DISABLE_UI_BUILD
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the frontend-build escape hatch is set
        run: |
          set -euo pipefail
          if [ -n "${DUX_DISABLE_UI_BUILD:-}" ]; then
            echo "DUX_DISABLE_UI_BUILD is set to '${DUX_DISABLE_UI_BUILD}' in this workflow's" >&2
            echo "environment. It skips the React build, so the binary would carry no web UI" >&2
            echo "and the static-serving tests would skip instead of asserting. Remove it." >&2
            exit 1
          fi
          echo "OK: DUX_DISABLE_UI_BUILD is not set; the frontend will be built."

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    # Gated, not merely accompanied: a sibling job that fails does not stop this
    # one from reporting green, and green-with-no-web-UI is the exact outcome the
    # guard exists to prevent.
    needs: no-ui-build-hatch
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  web-lint:
    name: Web lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/dux-web/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/dux-web/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # The frontend build and its unit tests, separate from lint so a lint failure and
  # a build failure are distinguishable at a glance. `cargo build` compiles the
  # frontend too (and now FAILS when it cannot), but that only happens in jobs that
  # build Rust; running `npm run build` here reports the tsc/Vite error directly,
  # and `npm run test` (vitest) covers the pure helpers the Rust side never touches.
  web-build:
    name: Web build and unit tests
    runs-on: ubuntu-latest
    needs: no-ui-build-hatch
    defaults:
      run:
        working-directory: crates/dux-web/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/dux-web/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the frontend
        run: npm run build

      - name: Run unit tests
        run: npm run test

  dep-isolation:
    name: dux-web dependency isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `alacritty_terminal` and `portable-pty` are intentional `dux-core`
      # deps (the PTY-based provider and the embedded terminal grid both
      # live in the core engine, not the TUI), so they appear in this
      # graph by design and are excluded from the deny-list below.
      - name: Verify dux-web does not depend on TUI crates
        run: |
          if cargo tree -p dux-web --edges normal,build,dev 2>&1 | grep -E '\b(dux-tui|ratatui|crossterm|crokey)\b'; then
            echo "FAIL: dux-web pulled in a TUI-only dependency" >&2
            exit 1
          fi
          echo "OK: dux-web dependency graph is TUI-free"
