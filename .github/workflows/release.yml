name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  # A release binary with no web UI is the failure this guard exists to prevent.
  # DUX_DISABLE_UI_BUILD makes crates/dux-web/build.rs skip the React build, which
  # would produce four platform archives serving a "web UI not built" notice page.
  # Every build job needs this one, so the hatch cannot ship.
  #
  # DUX_UI_BUILD_STATE is checked alongside it, belt and braces. build.rs stamps
  # that name on every path it takes and a cargo:rustc-env beats an ambient value,
  # so a set one can no longer talk the test suite into skipping; the two retired
  # names could, and are listed here so a branch still carrying one is caught
  # rather than quietly ignored.
  no-ui-build-hatch:
    name: Reject DUX_DISABLE_UI_BUILD
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the frontend-build escape hatch is set
        run: |
          set -euo pipefail
          failed=""
          for name in DUX_DISABLE_UI_BUILD DUX_UI_BUILD_STATE DUX_UI_BUILD_SKIPPED DUX_UI_BUILD_STALE; do
            value="$(printenv "$name" || true)"
            if [ -n "$value" ]; then
              echo "$name is set to '$value' in this workflow's environment. It skips the" >&2
              echo "React build or misreports whether one happened, so a release archive" >&2
              echo "could ship a placeholder page instead of the web UI, or ship untested." >&2
              echo "Refusing to build a release." >&2
              failed="yes"
            fi
          done
          [ -z "$failed" ] || exit 1
          echo "OK: no frontend-build escape hatch or state marker is set; the web UI will be built in."

  prepare-release:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    # Carries the guard edge even though it only reads the tag, so that "the
    # release workflow refuses to run with DUX_DISABLE_UI_BUILD set" is true of
    # the whole workflow rather than of most of it.
    needs: no-ui-build-hatch
    outputs:
      version: ${{ steps.release_version.outputs.value }}
      npm_tag: ${{ steps.npm_dist_tag.outputs.value }}
    steps:
      - name: Determine release version
        id: release_version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "Failed to extract version from ${{ github.event.release.tag_name }}"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine npm dist tag
        id: npm_dist_tag
        env:
          VERSION: ${{ steps.release_version.outputs.value }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "value=next" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.archive }}
    needs: [prepare-release, no-ui-build-hatch]
    runs-on: ${{ matrix.runner }}
    strategy:
      # Deliberately NOT fail-fast. Nothing this job produces is publicly
      # reachable (it uploads artifacts, not release assets), so letting the
      # other platforms finish costs nothing and reports every broken target in
      # one run instead of one per re-run. The gate is publish-archives below,
      # which needs ALL of them.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: dux-linux-amd64.tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            archive: dux-linux-arm64.tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: dux-darwin-amd64.tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: dux-darwin-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Set version from tag
        run: cargo set-version "${{ needs.prepare-release.outputs.version }}"

      - name: Build
        env:
          DUX_RELEASE_BUILD: "1"
        run: cargo build --release --target ${{ matrix.target }}

      # Symbol stripping happens in Cargo ([profile.release] strip = "symbols"),
      # so local release builds and CI produce the same binary and there is
      # exactly one stripping mechanism.

      - name: Package
        run: tar czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release dux

      # One "<archive>.sha256" beside each archive, in sha256sum's own format
      # (hex digest, two spaces, file name) so `sha256sum -c` and `shasum -a 256
      # -c` both accept it unchanged.
      #
      # Be honest about what this is for: it lets install.sh detect a corrupt or
      # truncated download, and it gives a value anyone can check by hand. It is
      # not tamper protection. Whoever could replace an archive on the release
      # page could replace this file next to it just as easily. Signing is what
      # would defend against that and is not in place.
      #
      # Linux runners have sha256sum, macOS runners have shasum, so pick
      # whichever exists rather than assuming one.
      - name: Checksum the archive
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            echo "Neither sha256sum nor shasum is available on this runner." >&2
            exit 1
          fi
          cat "${{ matrix.archive }}.sha256"

      # Start the archive that is about to be uploaded and confirm it really serves
      # the web UI: a page referencing a content-hashed bundle, that bundle
      # downloading, and a WebSocket upgrade completing. Placed BEFORE the upload so
      # a failure means nothing ships. See the script header for why this is the last
      # line of defence rather than the primary gate (the tag already exists by now)
      # and for the one matrix entry it can only skip.
      - name: Smoke-test the packaged archive
        run: .github/scripts/smoke_archive.sh ${{ matrix.archive }} ${{ matrix.target }}

      # NOTE: this job deliberately does NOT touch the release. It hands the
      # archive to publish-archives as a workflow artifact instead, so a platform
      # that fails cannot leave the other three downloadable against a tag that
      # already exists. See publish-archives for the reasoning.
      #
      # The .sha256 rides along so the combined-checksums step can concatenate the
      # four of them without recomputing anything.
      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          retention-days: 1
          if-no-files-found: error

  # THE PUBLISH GATE. Every release asset becomes publicly reachable here and
  # nowhere else.
  #
  # The build matrix used to upload its own archive, which meant a platform whose
  # smoke test failed left the other three downloadable against a tag that already
  # existed. The tag is created before this workflow starts, so there is no
  # "abort the release" to fall back on: the only lever is to publish nothing
  # until every platform has passed. `needs: [build]` gives exactly that, because
  # a needs edge requires ALL matrix legs to succeed. The smoke test still gates
  # its own archive inside the build job; this gates the release.
  #
  # It also publishes a single dux-checksums.txt holding all four lines, for a
  # human verifying a download by hand: `sha256sum -c dux-checksums.txt` in a
  # directory holding the archives. The installer deliberately does NOT use that
  # file, it fetches the per-archive .sha256 instead, so a single-platform user
  # never needs the other three archives present.
  #
  # Same honesty as above: this is corruption detection and a value to check out
  # of band, not tamper protection. It is unsigned and served from the same place
  # as the archives.
  publish-archives:
    name: Publish archives and checksums
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release archive artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/artifacts
          merge-multiple: true

      - name: Combine per-archive checksums
        run: |
          set -euo pipefail
          # Exported before the glob below, since it is the SHELL's locale that
          # decides the expansion order, not cat's.
          export LC_ALL=C
          cd dist/artifacts
          # The glob sorts, so the file is byte-stable regardless of the order
          # the matrix jobs happened to finish in.
          cat *.sha256 > dux-checksums.txt
          echo "Combined checksums:"
          cat dux-checksums.txt
          # Four archives in the matrix, so four lines. A short file means a
          # matrix job silently produced nothing.
          lines="$(wc -l < dux-checksums.txt)"
          if [ "$lines" -ne 4 ]; then
            echo "Expected 4 checksum lines, got ${lines}." >&2
            exit 1
          fi
          sha256sum -c dux-checksums.txt

      # One upload call for everything, so the release page goes from "no assets"
      # to "all assets" rather than filling in over several minutes.
      #
      # --clobber REPLACES an asset that is already there. Without it, re-running
      # this job after a partial failure dies on the first name that already
      # exists, which is precisely the state a re-run exists to repair.
      #
      # No checkout in this job, so gh cannot infer the repo from a git remote.
      # GH_REPO tells it explicitly.
      - name: Upload archives and checksums to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist/artifacts
          gh release upload "${{ github.event.release.tag_name }}" --clobber \
            *.tar.gz *.tar.gz.sha256 dux-checksums.txt
          echo "Published:"
          ls -1

  build-npm-package:
    name: Build npm package
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download release archive artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/artifacts
          merge-multiple: true

      - name: Build npm package
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          ARTIFACTS_DIR: dist/artifacts
        run: node npm/scripts/build_npm_package.mjs

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/npm/dux-npm-*.tgz
          retention-days: 1
          if-no-files-found: error

  publish-npm:
    name: Publish npm package
    needs: [prepare-release, build-npm-package]
    if: ${{ needs.build-npm-package.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@patrickdappollonio"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Download npm package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist/npm

      - name: Publish to npm
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          NPM_TAG: ${{ needs.prepare-release.outputs.npm_tag }}
        run: |
          set -euo pipefail
          tarball="dist/npm/dux-npm-${VERSION}.tgz"
          if [[ ! -f "$tarball" ]]; then
            echo "npm tarball $tarball not found"
            exit 1
          fi

          publish_cmd=(npm publish "$tarball" --access public)
          if [[ -n "$NPM_TAG" ]]; then
            publish_cmd+=(--tag "$NPM_TAG")
          fi

          echo "+ ${publish_cmd[*]}"
          "${publish_cmd[@]}"

  # Gated on the archives BEING PUBLISHED, not merely on the build matrix passing.
  # The install script is not an archive, but publishing it against a tag whose
  # archives never landed gives a user a one-line installer that 404s, and
  # `latest/download/install.sh` resolves to whichever release most recently had
  # one attached. Nothing becomes reachable until every archive is actually up.
  #
  # `needs: [build]` was the wrong edge for precisely the hazard described above:
  # it runs this job in PARALLEL with publish-archives rather than after it, so a
  # failed upload still left the installer attached to the tag.
  #
  # --clobber so re-running after a partial failure replaces the asset instead of
  # dying on the name already being there.
  upload-install-script:
    name: Upload install script
    runs-on: ubuntu-latest
    needs: [publish-archives]
    steps:
      - uses: actions/checkout@v4
      - name: Upload install script
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" --clobber install.sh

  update-release-notes:
    name: Append install instructions
    runs-on: ubuntu-latest
    needs: [build, publish-archives, upload-install-script]
    steps:
      - uses: actions/checkout@v4

      - name: Append install section to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Extract the Install section body from README
          # (between "## Install" and next "## ", excluding both headings)
          install_section=$(sed -n '/^## Install$/,/^## /{/^## /d; p}' README.md | sed -e :a -e '/^\n*$/{$d;N;ba;}')

          # Get current release body
          current_body=$(gh release view "${{ github.event.release.tag_name }}" --json body -q '.body')

          # Split at "Full Changelog" line and reassemble
          if echo "$current_body" | grep -q '^\*\*Full Changelog\*\*'; then
            before=$(echo "$current_body" | sed '/^\*\*Full Changelog\*\*/,$d' | sed -e :a -e '/^\n*$/{$d;N;ba;}')
            changelog_line=$(echo "$current_body" | grep '^\*\*Full Changelog\*\*')
            new_body="${before}

          ---

          ## Installation

          Use any of the following options to install dux on your system:

          ${install_section}

          ${changelog_line}"
          else
            # No Full Changelog line — just append
            new_body="${current_body}

          ---

          ## Installation

          Use any of the following options to install dux on your system:

          ${install_section}"
          fi

          gh release edit "${{ github.event.release.tag_name }}" --notes "$new_body"
