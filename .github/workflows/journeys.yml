name: Journeys

# The container journey suite (crates/dux-journeys): the real dux binary in
# Docker, driven over HTTP, WebSockets and a real browser, with nginx, Caddy and
# a stand-in Tailscale where a journey needs them. Linux only: the binary built
# here is mounted into a Linux container.
#
# Every push runs it, and a newer push to the same ref cancels the run still
# going for the older one: only the newest commit's answer is worth waiting for.
on:
  push:

concurrency:
  group: journeys-${{ github.ref }}
  cancel-in-progress: true

# Reading the repository is all this workflow does with its token.
permissions:
  contents: read

env:
  # Which journeys run. `auth` is every journey: the smoke journeys, which prove
  # the harness, the journeys for the web password login, and the command-line
  # journeys.
  JOURNEY_FEATURES: auth
  # The image the harness uses instead of building its own: the cached build
  # step below produces it.
  DUX_JOURNEY_IMAGE: dux-journeys:ci
  CARGO_TERM_COLOR: always

jobs:
  journeys:
    name: Container journeys (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The journeys need the web UI in the binary (a browser journey loads it),
      # and DUX_DISABLE_UI_BUILD would leave a notice page there instead. Same
      # guard as test.yml, inline because this workflow has a single job.
      - name: Fail if the frontend-build escape hatch is set
        run: |
          if [ -n "${DUX_DISABLE_UI_BUILD:-}" ]; then
            echo "DUX_DISABLE_UI_BUILD is set; the journeys need the web UI in the binary." >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      # build.rs compiles the React frontend into the binary, so npm is
      # required, at the version every other Rust job pins.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/dux-web/web/package-lock.json

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A cache of its own: the journeys profile and the test crate's
          # dependencies are not what the other jobs build.
          shared-key: journeys

      # The binary the containers mount, in the `journeys` profile (optimized,
      # but incremental and parallel: release's LTO build takes minutes).
      - name: Build the dux binary
        run: cargo build --profile journeys --bin dux

      # The third-party images (the journey image's base, nginx, Caddy), pinned
      # by digest in the one file the harness reads too; how to move one forward
      # is written at its top.
      - name: Read the pinned images
        run: grep -E '^JOURNEY_[A-Z_]+_IMAGE=' tools/preview-env/journey-images.env >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The preview environment's image with its journey tools on and its agent
      # CLIs off. Layers come from the Actions cache, so an unchanged Dockerfile
      # costs a cache restore rather than a package install.
      - name: Build the journey image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/preview-env
          build-args: |
            BASE_IMAGE=${{ env.JOURNEY_BASE_IMAGE }}
            AGENT_CLIS=0
            JOURNEY_TOOLS=1
          labels: dux-journeys=1
          tags: ${{ env.DUX_JOURNEY_IMAGE }}
          load: true
          cache-from: type=gha,scope=dux-journeys
          cache-to: type=gha,mode=max,scope=dux-journeys

      # Pulled up front so a registry hiccup fails here, by name, rather than
      # inside whichever journey happens to start the first proxy.
      - name: Pull the proxy images
        run: |
          docker pull "$JOURNEY_NGINX_IMAGE"
          docker pull "$JOURNEY_CADDY_IMAGE"

      # The repository's clippy gate lints this crate too (see its Cargo.toml);
      # this step lints it on its own, with every journey compiled.
      - name: Lint the journeys
        run: cargo clippy -p dux-journeys --all-targets --features auth -- -D warnings

      - name: Build the journeys
        run: cargo test -p dux-journeys --features "$JOURNEY_FEATURES" --no-run

      - name: Run the journeys
        run: cargo test -p dux-journeys --features "$JOURNEY_FEATURES" -- --test-threads=2

      # Every journey removes its containers when it ends; this is the backstop
      # for a run that was cancelled or killed mid-journey.
      - name: Remove anything a journey left behind
        if: always()
        run: |
          docker ps -aq --filter label=dux-journeys=1 | xargs -r docker rm -f
          docker network ls -q --filter label=dux-journeys=1 | xargs -r docker network rm
