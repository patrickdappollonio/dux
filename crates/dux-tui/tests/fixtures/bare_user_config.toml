shutdown_timeout_seconds = 30
[defaults]
provider = "claude"
start_directory = "/home/user/code"
enable_randomized_pet_name_by_default = false
pull_before_creating_agent_by_default = true
copy_uncommitted_changes_by_default = true

[env]

[logging]
level = "info"
path = "dux.log"

[ui]
left_width_pct = 23
right_width_pct = 19
terminal_pane_height_pct = 33
empty_project_separator_min_projects = 5
staged_pane_height_pct = 50
commit_pane_height_pct = 40
agent_scrollback_lines = 10000
status_clear_seconds = 6
branch_sync_interval = 30
show_diff_line_numbers = true
diff_tab_width = 4
github_integration = true
auto_reopen_agents = false
show_changes_pane = true
pr_banner_position = "top"
theme = "dux_dark"
copy_on_select = true
agent_tabs_max = 20
always_show_tab_strip = false
pr_poll_interval_seconds = 180
attention_indicator = true
attention_on_bell = true
attention_grace_seconds = 3
agent_sort = "manual"
compose_bar = true
disable_automated_welcome_screen = false
disable_release_notes = false

[editor]
default = "cursor"

[server]
port = 8080
tailscale_enabled = true
listen_addrs = []
insecure_allow_remote = false
dangerously_listen_http = false
color = "auto"
access_log = true
host = "127.0.0.1"
allowed_hosts = []
max_websocket_events_connections = 32
max_websocket_agent_connections = 32
max_websocket_terminal_connections = 64
title = "dux @ workstation"
favicon = ""
shutdown_timeout_seconds = 30
max_websocket_tab_connections = 64
max_websocket_tabs_per_agent = 8
search_index_max_files = 50000
tree_list_max_concurrency = 8
release_notes_max_concurrency = 2

[server.acme]
enabled = false
domains = []
email = ""
http_port = 80
https_port = 443
production = true
cache_dir = ""

[auth]
users = []

[terminal]
command = "/bin/bash"
args = ["-l"]

[startup_command_terminal]
command = "$SHELL"
args = ["-l", "-c"]

[keys]
show_terminal_keys = true

[providers]

[providers.claude]
command = "claude"
args = []
resume_args = ["--continue"]
install_hint = "curl -fsSL https://claude.ai/install.sh | bash"

[providers.codex]
command = "codex"
args = []
resume_args = ["resume", "--last"]
install_hint = "brew install --cask codex"

[providers.opencode]
command = "opencode"
args = []
resume_args = ["--continue"]
resume_wait_timeout_ms = 3000
install_hint = "curl -fsSL https://opencode.ai/install | bash"

[providers.copilot]
command = "copilot"
args = []
resume_args = []
install_hint = "curl -fsSL https://gh.io/copilot-install | bash"

[providers.cline]
command = "cline"
args = []
resume_args = []
install_hint = "npm i -g cline"

