[package]
name = "dux-web"
version.workspace = true
edition = "2024"

[dependencies]
dux-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
futures-util.workspace = true
# Server-assigned random per-connection ids for status-toast scoping on /ws.
uuid.workspace = true
# Wall-clock `HH:MM:SS` timestamps for the vite-style server console (console.rs).
chrono.workspace = true
# `interpolate-folder-path` is REQUIRED, not a nicety: web_assets.rs embeds
# `$OUT_DIR/ui`, the staged copy build.rs writes, and rust-embed only expands an
# environment variable in `folder` when this feature is on (the expansion is
# feature-gated in rust-embed-impl). Without it the path is taken literally and
# the crate does not compile. It pulls in `shellexpand`, but only as a
# proc-macro-time dependency: nothing from it reaches the runtime binary.
rust-embed = { version = "8", features = [
    "mime-guess",
    "debug-embed",
    "interpolate-folder-path",
] }
# Decompress embedded assets on the fly for the rare client that doesn't accept
# gzip (build.rs stores them gzipped to shrink the binary). Already in the lock.
flate2 = "1"

# Gzip the built web assets while staging them into $OUT_DIR/ui, so rust-embed
# bakes the compressed bytes into the binary (and they're served with
# Content-Encoding: gzip).
[build-dependencies]
flate2 = "1"

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite = { workspace = true }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json"] }
